app = 'deepseek-v3-research'
primary_region = 'ord'

[env]
NCCL_DEBUG = 'DEBUG'
NCCL_P2P_DISABLE = '1'
NCCL_SOCKET_IFNAME = 'eth0'
NCCL_SOCKET_FAMILY = 'AF_INET6'
GLOO_SOCKET_IFNAME = 'eth0'
VLLM_LOGGING_LEVEL = 'DEBUG'
#PYTORCH_NO_CUDA_MEMORY_CACHING='1'
#MODEL = 'OPEA/DeepSeek-V3-int4-sym-gptq-inc'
MODEL = 'cognitivecomputations/DeepSeek-V3-AWQ'

[[mounts]]
source = 'data'
destination = '/data'
initial_size = '2tb'

[http_service]
internal_port = 8000
force_https = true

[[vm]]
size = 'a100-80gb'
memory = '416gb'
cpus = 64
gpus = 8
